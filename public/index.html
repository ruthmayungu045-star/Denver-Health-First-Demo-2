<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Denver Health Leader Navigator</title>

    <!-- React via CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <style>
      :root {
        /* Denver Health Brand Colors */
        --dh-navy: #003b71;
        --dh-teal: #00a3ad;
        --dh-orange: #f47920;
        --dh-light-teal: #e6f7f8;
        
        /* UI Colors */
        --bg: #f0f6f7;
        --card: #ffffff;
        --text: #1a2a3a;
        --muted: #5a6b7c;
        --border: #d4e3e5;
        --shadow: 0 4px 20px rgba(0, 59, 113, 0.08);
        --shadow-lg: 0 8px 32px rgba(0, 59, 113, 0.12);
        
        /* Semantic */
        --assistant: #ffffff;
        --user: #e6f2f3;
        --danger: #c53030;
      }

      * { box-sizing: border-box; }
      
      html, body {
        height: 100%;
        margin: 0;
        font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
      }

      .app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ========== HEADER ========== */
      header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: linear-gradient(135deg, var(--dh-navy) 0%, var(--dh-teal) 100%);
        color: #fff;
        padding: 0;
        box-shadow: 0 2px 16px rgba(0, 59, 113, 0.25);
      }

      .header-row {
        max-width: 1100px;
        margin: 0 auto;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
      }

      .logo-container {
        width: 48px;
        height: 48px;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-container svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
      }

      .title-wrap {
        min-width: 0;
      }

      .title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.3px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 1px 2px rgba(0,0,0,0.1);
      }

      .subtitle {
        margin: 3px 0 0 0;
        font-size: 12px;
        opacity: 0.9;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
        letter-spacing: 0.5px;
      }

      .header-actions {
        display: flex;
        gap: 10px;
        flex: 0 0 auto;
      }

      .btn {
        appearance: none;
        border: 2px solid rgba(255,255,255,0.3);
        background: rgba(255,255,255,0.1);
        color: #fff;
        padding: 10px 18px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        user-select: none;
        backdrop-filter: blur(4px);
      }

      .btn:hover { 
        background: rgba(255,255,255,0.2);
        border-color: rgba(255,255,255,0.5);
        transform: translateY(-1px);
      }
      .btn:active { transform: translateY(0); }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

      /* ========== MAIN CONTENT ========== */
      main {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px 20px 16px;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* ========== WELCOME CARD ========== */
      .welcome {
        background: linear-gradient(135deg, #ffffff 0%, var(--dh-light-teal) 100%);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 18px 20px;
        position: relative;
        overflow: hidden;
      }

      .welcome::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--dh-navy), var(--dh-teal));
      }

      .welcome h2 {
        margin: 0 0 8px 0;
        font-size: 15px;
        font-weight: 700;
        color: var(--dh-navy);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .welcome h2::before {
        content: '✨';
      }

      .welcome p {
        margin: 0;
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.5;
      }

      /* ========== QUICK TOPICS ========== */
      .quick-topics {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip {
        border: 1px solid var(--border);
        background: #fff;
        padding: 10px 14px;
        border-radius: 24px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 2px 6px rgba(0,59,113,0.04);
      }

      .chip:hover { 
        background: var(--dh-light-teal);
        border-color: var(--dh-teal);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0,163,173,0.15);
      }
      .chip:active { transform: translateY(0); }
      .chip:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

      /* ========== CHAT CONTAINER ========== */
      .chat-shell {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow-lg);
        display: flex;
        flex-direction: column;
        min-height: 55vh;
        overflow: hidden;
      }

      /* ========== MESSAGES ========== */
      .messages {
        padding: 18px;
        overflow: auto;
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 14px;
        background: linear-gradient(180deg, #fafcfc 0%, #ffffff 100%);
      }

      .row {
        display: flex;
        width: 100%;
      }

      .row.assistant { justify-content: flex-start; }
      .row.user { justify-content: flex-end; }

      .bubble {
        max-width: 780px;
        width: fit-content;
        padding: 14px 16px;
        border-radius: 16px;
        line-height: 1.55;
        font-size: 14px;
        position: relative;
      }

      .bubble.assistant {
        background: var(--assistant);
        border: 1px solid var(--border);
        box-shadow: 0 2px 8px rgba(0,59,113,0.06);
        border-top-left-radius: 4px;
      }

      .bubble.user {
        background: linear-gradient(135deg, var(--dh-navy) 0%, #004d8c 100%);
        color: #fff;
        border: none;
        border-top-right-radius: 4px;
        box-shadow: 0 3px 12px rgba(0,59,113,0.2);
      }

      .meta {
        font-size: 11px;
        margin-top: 8px;
        opacity: 0.55;
        font-weight: 500;
      }

      .bubble.user .meta {
        opacity: 0.7;
      }

      /* ========== MARKDOWN STYLES ========== */
      .bubble.assistant .markdown-content {
        line-height: 1.65;
      }

      .bubble.assistant .markdown-content h1,
      .bubble.assistant .markdown-content h2,
      .bubble.assistant .markdown-content h3,
      .bubble.assistant .markdown-content h4 {
        margin: 18px 0 10px 0;
        font-weight: 700;
        color: var(--dh-navy);
        line-height: 1.35;
      }

      .bubble.assistant .markdown-content h1:first-child,
      .bubble.assistant .markdown-content h2:first-child,
      .bubble.assistant .markdown-content h3:first-child,
      .bubble.assistant .markdown-content h4:first-child {
        margin-top: 0;
      }

      .bubble.assistant .markdown-content h1 { font-size: 1.4em; }
      .bubble.assistant .markdown-content h2 { font-size: 1.25em; }
      .bubble.assistant .markdown-content h3 { font-size: 1.1em; }
      .bubble.assistant .markdown-content h4 { font-size: 1em; }

      .bubble.assistant .markdown-content p {
        margin: 0 0 12px 0;
      }

      .bubble.assistant .markdown-content p:last-child {
        margin-bottom: 0;
      }

      .bubble.assistant .markdown-content ul,
      .bubble.assistant .markdown-content ol {
        margin: 10px 0;
        padding-left: 22px;
      }

      .bubble.assistant .markdown-content li {
        margin-bottom: 6px;
      }

      .bubble.assistant .markdown-content li:last-child {
        margin-bottom: 0;
      }

      .bubble.assistant .markdown-content strong {
        font-weight: 700;
        color: var(--dh-navy);
      }

      .bubble.assistant .markdown-content em {
        font-style: italic;
        color: var(--muted);
      }

      .bubble.assistant .markdown-content code {
        background: var(--dh-light-teal);
        padding: 2px 6px;
        border-radius: 4px;
        font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
        font-size: 0.9em;
        color: var(--dh-navy);
      }

      .bubble.assistant .markdown-content pre {
        background: #f8fafb;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        overflow-x: auto;
        margin: 12px 0;
      }

      .bubble.assistant .markdown-content pre code {
        background: transparent;
        padding: 0;
        border-radius: 0;
      }

      .bubble.assistant .markdown-content blockquote {
        border-left: 4px solid var(--dh-teal);
        margin: 12px 0;
        padding: 10px 16px;
        background: var(--dh-light-teal);
        border-radius: 0 8px 8px 0;
        color: var(--muted);
      }

      .bubble.assistant .markdown-content a {
        color: var(--dh-teal);
        text-decoration: none;
        font-weight: 500;
        border-bottom: 1px solid transparent;
        transition: border-color 0.2s ease;
      }

      .bubble.assistant .markdown-content a:hover {
        border-bottom-color: var(--dh-teal);
      }

      .bubble.assistant .markdown-content hr {
        border: none;
        height: 1px;
        background: var(--border);
        margin: 16px 0;
      }

      .bubble.assistant .markdown-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 12px 0;
        font-size: 0.95em;
      }

      .bubble.assistant .markdown-content th,
      .bubble.assistant .markdown-content td {
        border: 1px solid var(--border);
        padding: 10px 12px;
        text-align: left;
      }

      .bubble.assistant .markdown-content th {
        background: var(--dh-light-teal);
        font-weight: 600;
        color: var(--dh-navy);
      }

      .bubble.assistant .markdown-content tr:nth-child(even) {
        background: #fafcfc;
      }

      /* ========== LOADING ANIMATION ========== */
      .loading-dots {
        display: flex;
        gap: 5px;
        align-items: center;
        padding: 4px 0;
      }

      .loading-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dh-teal);
        animation: bounce 1.4s ease-in-out infinite both;
      }

      .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
      .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
      .loading-dots span:nth-child(3) { animation-delay: 0s; }

      @keyframes bounce {
        0%, 80%, 100% { 
          transform: scale(0.6);
          opacity: 0.4;
        }
        40% { 
          transform: scale(1);
          opacity: 1;
        }
      }

      /* ========== COMPOSER ========== */
      .composer {
        display: flex;
        gap: 12px;
        padding: 16px 18px;
        background: #fafcfc;
        border-top: 1px solid var(--border);
        align-items: flex-end;
      }

      .composer textarea {
        flex: 1;
        border: 2px solid var(--border);
        border-radius: 14px;
        padding: 12px 16px;
        resize: none;
        font-size: 14px;
        line-height: 1.45;
        font-family: inherit;
        color: var(--text);
        background: #fff;
        min-height: 48px;
        max-height: 140px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .composer textarea::placeholder {
        color: #94a3b8;
      }

      .composer textarea:focus {
        outline: none;
        border-color: var(--dh-teal);
        box-shadow: 0 0 0 3px rgba(0,163,173,0.12);
      }

      .composer textarea:disabled {
        background: #f8fafb;
        opacity: 0.7;
      }

      .composer .send {
        appearance: none;
        border: none;
        background: linear-gradient(135deg, var(--dh-navy) 0%, var(--dh-teal) 100%);
        color: #fff;
        padding: 12px 22px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 3px 12px rgba(0,59,113,0.25);
      }

      .composer .send:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 5px 16px rgba(0,59,113,0.35);
      }

      .composer .send:active:not(:disabled) {
        transform: translateY(0);
      }

      .composer .send:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      /* ========== STATUS BAR ========== */
      .status {
        padding: 8px 18px 12px;
        font-size: 12px;
        text-align: center;
        background: #fafcfc;
      }

      .status .error {
        color: var(--danger);
        font-weight: 500;
      }

      /* ========== FOOTER ========== */
      footer {
        text-align: center;
        padding: 16px 20px;
        font-size: 12px;
        color: var(--muted);
        border-top: 1px solid var(--border);
        background: #fff;
      }

      footer span {
        color: var(--dh-orange);
        font-weight: 600;
      }

      /* ========== RESPONSIVE ========== */
      @media (max-width: 640px) {
        .header-row {
          padding: 10px 14px;
        }

        .logo-container {
          width: 40px;
          height: 40px;
        }

        .title {
          font-size: 15px;
        }

        .subtitle {
          font-size: 11px;
        }

        main {
          padding: 14px 14px 10px;
        }

        .welcome {
          padding: 14px 16px;
        }

        .chip {
          padding: 8px 12px;
          font-size: 12px;
        }

        .messages {
          padding: 14px;
        }

        .composer {
          padding: 12px 14px;
        }

        .composer .send {
          padding: 12px 16px;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo } = React;

      // Denver Health Logo - Accurate recreation
      function DenverHealthLogo() {
        return (
          <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
              {/* Clip path for the heart shape */}
              <clipPath id="heartClip">
                <path d="M50 88 C15 55, 2 35, 12 20 C22 5, 38 5, 50 20 C62 5, 78 5, 88 20 C98 35, 85 55, 50 88Z" />
              </clipPath>
            </defs>
            
            {/* Heart background - split diagonally */}
            <g clipPath="url(#heartClip)">
              {/* Navy left side */}
              <polygon points="0,0 55,0 45,100 0,100" fill="#003b71" />
              {/* Teal right side */}
              <polygon points="55,0 100,0 100,100 45,100" fill="#00a3ad" />
            </g>
            
            {/* White mountain range */}
            <path
              d="M18 62 L32 42 L42 52 L58 32 L72 50 L82 62 Z"
              fill="white"
              clipPath="url(#heartClip)"
            />
            
            {/* Orange sun/star burst */}
            <g transform="translate(62, 28)">
              <circle cx="0" cy="0" r="5" fill="#f47920" />
              {/* Sun rays */}
              <line x1="0" y1="-8" x2="0" y2="-12" stroke="#f47920" strokeWidth="2.5" strokeLinecap="round" />
              <line x1="5.7" y1="-5.7" x2="8.5" y2="-8.5" stroke="#f47920" strokeWidth="2.5" strokeLinecap="round" />
              <line x1="8" y1="0" x2="12" y2="0" stroke="#f47920" strokeWidth="2.5" strokeLinecap="round" />
              <line x1="5.7" y1="5.7" x2="8.5" y2="8.5" stroke="#f47920" strokeWidth="2.5" strokeLinecap="round" />
            </g>
          </svg>
        );
      }

      // Loading dots component
      function LoadingDots() {
        return (
          <div className="loading-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        );
      }

      // Helper: current time string
      function nowStamp() {
        return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }

      // Markdown rendering with DOMPurify
      function renderMarkdown(text) {
        if (!text) return { __html: '' };
        try {
          const rawHtml = marked.parse(text, { breaks: true, gfm: true });
          const cleanHtml = DOMPurify.sanitize(rawHtml, {
            ALLOWED_TAGS: ['h1','h2','h3','h4','h5','h6','p','br','strong','em','u','s','a','ul','ol','li','blockquote','pre','code','hr','table','thead','tbody','tr','th','td'],
            ALLOWED_ATTR: ['href','target','rel']
          });
          return { __html: cleanHtml };
        } catch (e) {
          return { __html: DOMPurify.sanitize(text) };
        }
      }

      function App() {
        const [messages, setMessages] = useState(() => {
          return [
            {
              role: "assistant",
              content:
                "Welcome to the **Denver Health Leader Navigator**! 👋\n\nI'm here to help you with questions about:\n- Coaching conversations\n- Leadership norms\n- Delivering feedback\n- Engagement surveys\n- Compensation discussions\n- Administrative leave\n\nIf I don't have Denver Health-specific guidance, I'll direct you to your **HRBP**.",
              ts: nowStamp(),
            },
          ];
        });

        const [input, setInput] = useState("");
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState("");

        const messagesRef = useRef(null);
        const textareaRef = useRef(null);

        const quickTopics = useMemo(
          () => [
            { label: "💬 Coaching", prompt: "How do I structure a coaching conversation using the Denver Health Coaching Model?" },
            { label: "📋 Leadership Norms", prompt: "What are the Denver Health leadership norms and how should I apply them?" },
            { label: "📊 Feedback", prompt: "What does Denver Health define as effective feedback, and what are tips for delivering it?" },
            { label: "⏸️ Admin Leave", prompt: "What should I say and do when placing an employee on administrative leave?" },
            { label: "🎯 Engagement", prompt: "How should I share and act on Your Voice, Our Vision engagement survey results with my team?" },
            { label: "💰 Compensation", prompt: "How is pay determined at Denver Health, and how should leaders talk about pay?" },
            { label: "🏆 Recognition", prompt: "How does Denver Health think about total rewards and recognition beyond compensation?" },
            { label: "📚 LEAD Process", prompt: "What is LEAD at Denver Health and why is it important?" },
          ],
          []
        );

        useEffect(() => {
          const el = messagesRef.current;
          if (!el) return;
          el.scrollTop = el.scrollHeight;
        }, [messages, loading]);

        useEffect(() => {
          const ta = textareaRef.current;
          if (!ta) return;
          ta.style.height = "0px";
          ta.style.height = Math.min(140, ta.scrollHeight) + "px";
        }, [input]);

        function resetChat() {
          setError("");
          setLoading(false);
          setInput("");
          setMessages([
            {
              role: "assistant",
              content:
                "New conversation started. How can I help you today?\n\nFeel free to ask about leadership, coaching, engagement, compensation, or any HR-related topics covered in our documents.",
              ts: nowStamp(),
            },
          ]);
          setTimeout(() => textareaRef.current?.focus(), 0);
        }

        async function sendMessage(text) {
          const trimmed = (text || "").trim();
          if (!trimmed || loading) return;

          setError("");
          setLoading(true);

          const userMsg = { role: "user", content: trimmed, ts: nowStamp() };
          const nextMessages = [...messages, userMsg];
          setMessages(nextMessages);
          setInput("");

          try {
            const payload = {
              messages: nextMessages.map((m) => ({ role: m.role, content: m.content })),
            };

            const resp = await fetch("/api/chat", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (!resp.ok) {
              const t = await resp.text();
              throw new Error(`API error (${resp.status}): ${t}`);
            }

            const data = await resp.json();

            const modelText =
              data &&
              Array.isArray(data.content) &&
              data.content[0] &&
              typeof data.content[0].text === "string"
                ? data.content[0].text.trim()
                : "";

            const assistantMsg = {
              role: "assistant",
              content: modelText || "I don't have specific Denver Health guidance on this topic. Please consult your HRBP for assistance.",
              ts: nowStamp(),
            };

            setMessages((prev) => [...prev, assistantMsg]);
          } catch (e) {
            setError(e && e.message ? e.message : String(e));
            setMessages((prev) => [
              ...prev,
              {
                role: "assistant",
                content:
                  "I don't have specific Denver Health guidance on this topic. Please consult your HRBP for assistance.",
                ts: nowStamp(),
              },
            ]);
          } finally {
            setLoading(false);
            setTimeout(() => textareaRef.current?.focus(), 0);
          }
        }

        function onKeyDown(e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage(input);
          }
        }

        return (
          <div className="app">
            <header>
              <div className="header-row">
                <div className="brand">
                  <div className="logo-container">
                    <DenverHealthLogo />
                  </div>
                  <div className="title-wrap">
                    <p className="title">Denver Health Leader Navigator</p>
                    <p className="subtitle">HRBP Assistant • Demo v1.0</p>
                  </div>
                </div>

                <div className="header-actions">
                  <button className="btn" onClick={resetChat} disabled={loading}>
                    New Chat
                  </button>
                </div>
              </div>
            </header>

            <main>
              <section className="welcome">
                <h2>Getting Started</h2>
                <p>
                  This tool is powered by Denver Health HR Documents. For in-depth information on safety concerns, harassment/discrimination allegations,
                  legal questions, terminations, investigations, or anything not covered in the documents, please consult your HRBP.
                </p>
              </section>

              <section className="quick-topics" aria-label="Quick topics">
                {quickTopics.map((t) => (
                  <button
                    key={t.label}
                    className="chip"
                    disabled={loading}
                    onClick={() => sendMessage(t.prompt)}
                    title={t.prompt}
                  >
                    {t.label}
                  </button>
                ))}
              </section>

              <section className="chat-shell" aria-label="Chat">
                <div className="messages" ref={messagesRef}>
                  {messages.map((m, idx) => (
                    <div key={idx} className={"row " + (m.role === "user" ? "user" : "assistant")}>
                      <div className={"bubble " + (m.role === "user" ? "user" : "assistant")}>
                        {m.role === "user" ? (
                          m.content
                        ) : (
                          <div 
                            className="markdown-content" 
                            dangerouslySetInnerHTML={renderMarkdown(m.content)} 
                          />
                        )}
                        <div className="meta">
                          {m.role === "user" ? "You" : "Navigator"} • {m.ts}
                        </div>
                      </div>
                    </div>
                  ))}

                  {loading && (
                    <div className="row assistant">
                      <div className="bubble assistant" aria-live="polite">
                        <LoadingDots />
                        <div className="meta">Navigator • thinking</div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="composer">
                  <textarea
                    ref={textareaRef}
                    placeholder='Type your question… (Enter to send, Shift+Enter for new line)'
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    onKeyDown={onKeyDown}
                    disabled={loading}
                    aria-label="Message input"
                  ></textarea>

                  <button
                    className="send"
                    onClick={() => sendMessage(input)}
                    disabled={loading || !input.trim()}
                    aria-label="Send"
                  >
                    Send
                  </button>
                </div>

                <div className="status">
                  {error ? <span className="error">⚠️ {error}</span> : <span>&nbsp;</span>}
                </div>
              </section>
            </main>

            <footer>
              <span>Denver Health</span> & Hospital Authority • Demo Version • est. 1860
            </footer>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
